<!DOCTYPE html>
<html>
<head>
    <link href="style.css" rel="stylesheet">
    <link rel="icon" href="Media/coffee.gif">
    <title>My Desk</title> 
</head>
<body>
<button title="ctrl g" id="gardeniamode">Gardenia</button> <a href="index.html"><button>Home</button></a>
<h1 class="desk-title">Desk</h1>

<div class="desk-area">
<div class="desk-left">
 <h3 class="desktitles-left" >Current Chapter Progress</h3>
    <div class="progress-bar">
        <div class="writing-bar"><p class="pro-number">31%</p></div>
    </div> 
 <h2 class="desktitles-left"> To Do List</h2>
    <div class="todolist">
        <a class="checkbox1"><p class=checktext>Complete Gallery Page</p></a>
        <a class="checkbox2"><p class=checktext>Complete Desk Page</p></a>
        <a class="checkbox3"><p class=checktext>Complete World Page</p></a>
        <a class="checkbox4"><p class=checktext>Insert Text</p></a>
        <a class="checkbox5"><p class=checktext>Insert Text</p></a>
    </div>
</div>    
<div class="desk-center"></div>

<div class="desk-right">  
<p style="color: white; text-align:center;">Writing Sprint Timer</p> 
  <div class="pixel-timer">   
     <h1 class="timer" id="timer">20:00</h1>
        <div class="button-wrapper">
            <button id="start">></button>
            <button id="stop">x</button>
            <button id="reset">=</button>
        </div>
    </div> 
    <h1 style="font-family:'Courier New', Courier, monospace; color: white; text-align: center;">
    Memo</h1>
   <div> 
   <textarea class="sticky-note" placeholder="write memo here :)"></textarea>
   <button onclick="savebtn()" class="savebtn">Save</button>
   </div>
  
</div>
<!-- 
    -Progress bar
    -Weekly to-do list (with dates)
    -Coffee cup counter
    -writing sprint timer
    -sticky notes
-->    

</body>
<script src="script.js" ></script>            
</html>
